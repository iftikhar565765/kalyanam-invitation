<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Great+Vibes&family=Cormorant+Garamond:ital@0;1&family=Jost:wght@300;400&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
body { margin:0; width:1200px; height:630px; overflow:hidden; background:#F8F1E0; }
.cover { width:1200px; height:630px; position:relative;
  background:
    radial-gradient(120% 100% at 50% -10%, #FBF5E6 0%, rgba(251,245,230,0) 55%),
    radial-gradient(90% 90% at 50% 118%, #EFE2C4 0%, rgba(239,226,196,0) 60%),
    linear-gradient(180deg, #F8F1E0 0%, #F1E5CC 100%);
  display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
.frame { position:absolute; inset:16px; border:1.5px solid rgba(184,134,43,.55); }
.frame::after { content:''; position:absolute; inset:6px; border:1px solid rgba(184,134,43,.3); }
.mandala { position:absolute; right:-170px; top:-130px; width:520px; opacity:.12; }
.toran { position:absolute; top:-6px; left:50%; transform:translateX(-50%); width:820px; max-width:none; }
.ganesha { width:92px; filter: drop-shadow(0 6px 14px rgba(150,112,42,.35)); margin:112px 0 12px; }
.shloka { font-family:'Tiro Devanagari Hindi',serif; font-size:20px; color:#96702A; letter-spacing:.08em; }
.eyebrow { font-family:'Cormorant Garamond',serif; font-style:italic; font-size:19px; letter-spacing:.06em; color:rgba(110,74,56,.85); margin-top:14px; }
.names { font-family:'Prata',serif; font-size:72px; line-height:1.05; margin-top:8px; color:#40261A; }
.names .amp { font-family:'Great Vibes',cursive; font-size:60px; color:#C4406E; }
.line { width:340px; height:44px; margin:2px 0 0; color:#96702A; }
.date { font-family:'Jost',sans-serif; font-size:16px; letter-spacing:.4em; text-transform:uppercase; color:#822D39; margin-top:12px; }
.sub { margin-top:8px; font-family:'Cormorant Garamond',serif; font-style:italic; font-size:21px; color:rgba(110,74,56,.9); }
.wordmark { position:absolute; bottom:22px; left:0; right:0; font-family:'Jost',sans-serif;
  font-size:11px; letter-spacing:.5em; text-transform:uppercase; color:rgba(150,112,42,.6); }
</style></head>
<body>
<div class="cover">
  <div class="frame"></div>
  <img class="mandala" src="assets/art/mandala.png" alt="">
  <img class="toran" src="assets/art/toran.png" alt="">
  <img class="ganesha" src="assets/art/ganesha.png" alt="">
  <div class="shloka">॥ श्री गणेशाय नमः ॥</div>
  <div class="eyebrow">Together with their families</div>
  <div class="names">Arjun <span class="amp">&amp;</span> Meghana</div>
  <svg class="line" viewBox="0 0 320 44"><path fill="none" stroke="currentColor" stroke-width="1.1" stroke-linecap="round" d="M12 22 L 118 22 M202 22 L 308 22"/><circle cx="128" cy="22" r="1.6" fill="currentColor"/><circle cx="192" cy="22" r="1.6" fill="currentColor"/><path fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" d="M159.4 32.6 C 165.6 31.8 170 26.8 169.8 21.4 C 169.6 15.6 164.6 11.2 158.8 11.4 C 153.4 11.6 149.4 15.8 149.4 21 C 149.4 25.6 152.8 29.2 157.2 29.4 C 160.7 29.5 163.5 27 163.5 23.9 C 163.5 21.2 161.4 19.1 158.9 19.1 C 156.8 19.1 155.1 20.7 155.1 22.7"/><circle cx="158.9" cy="21.9" r="1.5" fill="currentColor"/></svg>
  <div class="date">23 · 05 · 2026 · Bengaluru</div>
  <div class="sub">Haldi, Mehndi, Sangeet &amp; the sacred Muhurtham</div>
  <div class="wordmark">Shubh Vivah</div>
</div>
</body></html>
