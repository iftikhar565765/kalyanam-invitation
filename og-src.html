<!DOCTYPE html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Rozha+One&family=EB+Garamond:ital@0;1&family=Pinyon+Script&family=Jost:wght@300;400&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<style>
body { margin:0; width:1200px; height:630px; overflow:hidden; background:#F3E3D3; }
.cover { width:1200px; height:630px; position:relative;
  background:
    radial-gradient(120% 100% at 50% -10%, #F7EEE2 0%, rgba(247,238,226,0) 55%),
    radial-gradient(90% 90% at 50% 118%, #EBD6BF 0%, rgba(235,214,191,0) 60%),
    linear-gradient(180deg, #F3E3D3 0%, #EDD6C1 100%);
  display:flex; align-items:center; justify-content:center; }
.mandala { position:absolute; left:-190px; top:-150px; width:560px; opacity:.12; }
.mandala--r { left:auto; right:-190px; top:auto; bottom:-190px; }
.card { position:relative; width:470px; height:562px; margin-top:44px; }
.card__arch { position:absolute; inset:0; width:100%; height:100%; }
.paper { fill:#FBF3E8; }
.line { fill:none; stroke:#B6893C; stroke-width:2.4; }
.line--inner { stroke-width:1.1; opacity:.85; }
.bloom { position:absolute; top:-14px; width:150px; }
.bloom--l { left:-34px; }
.bloom--r { right:-34px; transform:scaleX(-1); }
.bell { position:absolute; top:-10px; width:44px; }
.bell--l { left:88px; }
.bell--r { right:88px; }
.inner { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; text-align:center;
  padding:60px 44px 0; }
.ganesha { width:74px; filter: drop-shadow(0 6px 14px rgba(143,107,44,.4)); }
.shloka { font-family:'Tiro Devanagari Hindi',serif; font-size:15px; color:#8F6B2C; letter-spacing:.08em; margin-top:8px; }
.eyebrow { font-family:'EB Garamond',serif; font-size:12px; letter-spacing:.28em; text-transform:uppercase; color:#8F6B2C; margin-top:10px; max-width:36ch; }
.names { font-family:'Pinyon Script',cursive; font-size:54px; line-height:1.15; margin-top:6px; color:#7D2B3A; }
.and { font-family:'EB Garamond',serif; font-style:italic; font-size:20px; color:#8F6B2C; margin:0; }
.daterow { display:flex; align-items:center; gap:12px; margin-top:10px; }
.dside { font-family:'EB Garamond',serif; font-size:21px; letter-spacing:.18em; text-transform:uppercase; color:#631F2C; }
.dnum { font-family:'Rozha One',serif; font-size:48px; line-height:1;
  background:linear-gradient(170deg,#d8ad45 6%,#a87c22 32%,#7c5c1a 50%,#b6893c 68%,#8a641c 86%,#6f5216 96%);
  -webkit-background-clip:text; background-clip:text; color:transparent; }
.orn { width:20px; color:#8F6B2C; }
.venue { font-family:'EB Garamond',serif; font-size:12.5px; letter-spacing:.15em; text-transform:uppercase; color:#7D2B3A; margin-top:16px; line-height:1.8; max-width:44ch; }
.wordmark { position:absolute; bottom:8px; left:0; right:0; font-family:'Jost',sans-serif;
  font-size:11px; letter-spacing:.5em; text-transform:uppercase; color:rgba(143,107,44,.7); text-align:center; }
</style></head>
<body>
<div class="cover">
  <img class="mandala" src="assets/art/mandala.png" alt="">
  <img class="mandala mandala--r" src="assets/art/mandala.png" alt="">
  <div class="card">
    <svg class="card__arch" viewBox="0 0 720 1060" preserveAspectRatio="none">
      <path class="paper" d="M 30 1030 L 30 472 Q -6 402.1 45.7 342.9 Q 30.8 267.1 95.8 225.3 Q 108.6 149.3 184.1 133.2 Q 221.6 65.6 298.3 75.5 Q 360 33.5 421.7 75.5 Q 498.4 65.6 535.9 133.2 Q 611.4 149.3 624.2 225.3 Q 689.2 267.1 674.3 342.9 Q 726 402.1 690 472 L 690 1030 Z"/>
      <path class="line" d="M 30 1030 L 30 472 Q -6 402.1 45.7 342.9 Q 30.8 267.1 95.8 225.3 Q 108.6 149.3 184.1 133.2 Q 221.6 65.6 298.3 75.5 Q 360 33.5 421.7 75.5 Q 498.4 65.6 535.9 133.2 Q 611.4 149.3 624.2 225.3 Q 689.2 267.1 674.3 342.9 Q 726 402.1 690 472 L 690 1030"/>
      <path class="line line--inner" d="M 46 1030 L 46 472 Q -7.1 410.9 30.2 339 Q 14.7 260.1 82.4 216.6 Q 95.8 137 174.8 120.2 Q 213.6 50.1 293 60.4 Q 360 14.9 427 60.4 Q 506.4 50.1 545.2 120.2 Q 624.2 137 637.6 216.6 Q 705.3 260.1 689.8 339 Q 727.1 410.9 674 472 L 674 1030"/>
    </svg>
    <img class="bloom bloom--l" src="assets/art/blossom-cascade.png" alt="">
    <img class="bloom bloom--r" src="assets/art/blossom-cascade.png" alt="">
    <img class="bell bell--l" src="assets/art/temple-bell.png" alt="">
    <img class="bell bell--r" src="assets/art/temple-bell.png" alt="">
    <div class="inner">
      <img class="ganesha" src="assets/art/ganesha-gold.png" alt="">
      <div class="shloka">॥ श्री गणेशाय नमः ॥</div>
      <div class="eyebrow">With the divine blessings of our families</div>
      <div class="names">Arjun</div>
      <div class="and">and</div>
      <div class="names" style="margin-top:0">Meghana</div>
      <div class="daterow">
        <span class="dside">May</span>
        <svg class="orn" viewBox="0 0 34 44"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4 L 22 12 L 17 20 L 12 12 Z"/><path stroke-width="1.1" d="M17 20 V 34"/><circle cx="17" cy="38.5" r="1.5" fill="currentColor" stroke="none"/></g></svg>
        <span class="dnum">22</span>
        <svg class="orn" viewBox="0 0 34 44" style="transform:scaleX(-1)"><g fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 4 L 22 12 L 17 20 L 12 12 Z"/><path stroke-width="1.1" d="M17 20 V 34"/><circle cx="17" cy="38.5" r="1.5" fill="currentColor" stroke="none"/></g></svg>
        <span class="dside">2027</span>
      </div>
      <div class="venue">Sri Lakshmi Venkateshwara Kalyana Mandapam · Bengaluru</div>
    </div>
  </div>
  <div class="wordmark">Your presence will make our day complete</div>
</div>
</body></html>
